[package]
name = "clip-sanitizer"
version = "0.2.0"
description = "Tray app: select text, press a hotkey, get a sanitized copy on the clipboard"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.14"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
arboard = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Embeds the ui/ folder so a plain `cargo build --release` produces a working exe.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
