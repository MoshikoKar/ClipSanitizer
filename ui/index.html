<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip Sanitizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icon.png" alt="" width="22" height="22">
      <span>Clip Sanitizer</span>
    </div>
    <div class="hint" id="hint">Select text anywhere and press <kbd id="hint-key">Ctrl+Alt+C</kbd></div>
    <button class="ghost" id="settings-btn" aria-expanded="false">Settings</button>
  </header>

  <section class="settings" id="settings" hidden>
    <div class="grid">
      <label>Hotkey
        <input id="hotkey" readonly placeholder="Click, then press keys">
        <small>Click the box and press the new combination.</small>
      </label>
      <label class="wide">Patterns file <small>(same format as Log Sanitizer's config.json; empty = default)</small>
        <input id="patterns-file" placeholder="" spellcheck="false">
      </label>
      <div class="checks">
        <label><input type="checkbox" id="paste-after"> Also paste over the selection</label>
        <label><input type="checkbox" id="show-toast"> Show notification</label>
        <label><input type="checkbox" id="autostart"> Start with Windows</label>
        <label><input type="checkbox" id="check-updates"> Check for updates</label>
      </div>
      <label>Update channel
        <select id="update-channel">
          <option value="stable">Stable</option>
          <option value="beta">Beta</option>
        </select>
      </label>
      <div class="row">
        <button id="save-settings">Save settings</button>
        <button class="ghost" id="open-patterns">Edit patterns file</button>
        <button class="ghost" id="reload">Reload patterns</button>
        <span class="msg" id="settings-msg"></span>
      </div>
    </div>
  </section>

  <main>
    <aside class="patterns">
      <div class="patterns-head">
        <strong>Patterns</strong>
        <input id="filter" type="search" placeholder="Filter…">
      </div>
      <ul id="pattern-list"></ul>
      <p class="load-msg" id="load-msg"></p>
    </aside>

    <section class="work">
      <div class="pane">
        <div class="pane-head">
          <strong>Input</strong>
          <div class="row">
            <button class="ghost" id="paste">Paste</button>
            <button class="ghost" id="clear">Clear</button>
          </div>
        </div>
        <textarea id="input" spellcheck="false" placeholder="Paste or type text here, then press Sanitize (Ctrl+Enter)"></textarea>
      </div>
      <div class="actions">
        <button class="primary" id="sanitize">Sanitize</button>
        <span id="summary" class="summary"></span>
      </div>
      <div class="pane">
        <div class="pane-head">
          <strong>Sanitized</strong>
          <button id="copy" disabled>Copy</button>
        </div>
        <pre id="output" class="output" tabindex="0"></pre>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
