name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build release assets
        shell: pwsh
        run: .\build.ps1

      - name: Extract changelog notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="$VERSION" '
            BEGIN { keep=0 }
            $0 ~ "^## \\[" ver "\\]" { keep=1; next }
            keep && $0 ~ /^## \[/ { exit }
            keep { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG.md section found for ${VERSION}" >&2
            exit 1
          fi
          {
            echo ""
            echo "### Downloads"
            echo ""
            echo "- \`ClipSanitizer-Setup.exe\` - per-user installer"
            echo "- \`ClipSanitizer-portable.zip\` - portable exe + \`portable.txt\`"
            echo "- \`SHA256SUMS.txt\` - SHA-256 checksums (required by the in-app updater)"
            echo ""
            echo "### SHA-256"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$NOTES_FILE"
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ClipSanitizer ${{ github.ref_name }}
          body_path: ${{ env.NOTES_FILE }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/ClipSanitizer-Setup.exe
            dist/ClipSanitizer-portable.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
